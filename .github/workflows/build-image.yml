name: build-image

on:
  push:
    branches: [liquid-glass]
    paths:
      - "overlay/**"
      - "docker/heimdall-lg/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/heimdall-lg/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/heimdall-lg:latest
            ghcr.io/${{ github.repository_owner }}/heimdall-lg:2.8.3-lg
